name: Android Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's ubuntu runner images ship the Android SDK (platform 35,
      # build-tools 34/35) preinstalled - no third-party setup action needed.
      - name: Ensure Android SDK packages & licenses
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            printf 'storeFile=release-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "Signing release artifacts with the configured release key."
          else
            echo "::warning::No KEYSTORE_BASE64 secret set - release artifacts will be debug-signed (fine for testing, NOT for Play Store upload). See README for how to add signing secrets."
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK, release APK and release AAB
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Collect artifacts
        run: |
          mkdir -p ci-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk ci-artifacts/mbbshandbook-debug.apk
          cp app/build/outputs/apk/release/app-release.apk ci-artifacts/mbbshandbook-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ci-artifacts/mbbshandbook-release.aab
          ls -lh ci-artifacts/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: mbbshandbook-debug-apk
          path: ci-artifacts/mbbshandbook-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: mbbshandbook-release-apk
          path: ci-artifacts/mbbshandbook-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release AAB
        uses: actions/upload-artifact@v7
        with:
          name: mbbshandbook-release-aab
          path: ci-artifacts/mbbshandbook-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Write build summary
        run: |
          {
            echo "## 📱 MBBS Handbook build artifacts"
            echo ""
            echo "| Artifact | File | Size |"
            echo "|---|---|---|"
            for f in ci-artifacts/*; do
              echo "| $(basename "$f") | \`$f\` | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            if [ -f keystore.properties ]; then
              echo "🔐 Release artifacts signed with the configured release key."
            else
              echo "⚠️ Release artifacts are **debug-signed** (no signing secrets configured). See README → Release signing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ci-artifacts/mbbshandbook-debug.apk
            ci-artifacts/mbbshandbook-release.apk
            ci-artifacts/mbbshandbook-release.aab
          generate_release_notes: true
